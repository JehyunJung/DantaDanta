[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sagopalgo"
version = "0.1.0"
description = "KIS Open API 기반 자동 주식 트레이딩 시스템"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "websockets>=13.0",
    "pydantic-settings>=2.5.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "pandas-ta>=0.3.14b",
    "anthropic>=0.40.0",
    "apscheduler>=3.10.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["sagopalgo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]
